agents:
  queue: "{queue}"

label: "{name}"
step_id: package

commands:
  - bash qdb-api/pack.sh artifacts/*-api.tar.gz
  - bash qdb-server/pack.sh artifacts/*-server.tar.gz
  - bash qdb-utils/pack.sh artifacts/*-utils.tar.gz
  - bash qdb-rest/pack.sh artifacts/*-rest.tar.gz
  - bash qdb-code-signing/rpmsign.sh $(find . -name '*.rpm')

plugins:
  - bureau14/qdb-artifacts#sc-20192/snapshot-dependencies:
      download:
        clean: true
        projects:
          - project_id: "qdb-pkg-archives"
            step: [api, server, utils, rest]
            files:
              - "*.tar.gz"
            output-dir: artifacts
          - project_id: "qdb-code-signing"
            latest: true
            step: build
            files:
              - "qdb-code-signing.tar.gz"
            extract: true
            output-dir: qdb-code-signing
      upload:
        files:
        - "qdb-*/*.rpm"
      promote: {}
