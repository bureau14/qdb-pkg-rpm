services:
  build:
     build:
      context: .
      dockerfile: Dockerfile
     volumes:
      - ./:/workdir
     working_dir: /workdir

  qdb-server:
    build: qdb-server/
    image: bureau14/qdb-pkg-rpm/qdb-server
    privileged: true
    ports:
      - "2836:2836"

  qdb-api:
    build: qdb-api/
    image: bureau14/qdb-pkg-rpm/qdb-api
    links:
      - "qdb-server"

  qdb-rest:
    build: qdb-rest/
    links:
      - "qdb-server"
    image: bureau14/qdb-pkg-rpm/qdb-rest
    ports:
      - "40080:40080"
      - "40443:40443"
    privileged: true

  qdb-utils:
    build: qdb-utils/
    depends_on:
      - "qdb-api"
    links:
      - "qdb-server"
      - "qdb-rest"
    image: bureau14/qdb-pkg-rpm/qdb-utils
